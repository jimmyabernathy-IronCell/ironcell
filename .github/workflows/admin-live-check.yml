name: Admin entry live check

# Makes a loss LOUD, and now also makes it SELF-CORRECTING.
#
# It probes the PUBLISHED site, not the repo, so it catches a bad or cancelled
# Pages build as well as a dropped file. GitHub emails the owner of a scheduled
# workflow when it fails, so a silent disappearance becomes an email.
#
# HARDENED 2026-08-24. Previously this job only reported. If it fired at 3am
# nothing happened until a human read the mail. It now repairs first and only
# shouts if the repair did not take:
#   1. probe the live site
#   2. if that fails, run the Keep admin entry job (fixes a dropped file or a
#      dropped footer link) AND ask Pages to rebuild (fixes the case where the
#      repo is correct but the published site is stale from a cancelled build)
#   3. probe again, and only now fail for real
# Hourly rather than three-hourly, so the worst case is one hour of loss.
#
# HARDENED AGAIN 2026-08-24. One repair cycle was not always enough. The
# storefront is published in storms of 20-30 commits in under a minute, and
# during a storm the dispatched heal run can be superseded before it starts and
# a Pages build can be cancelled by the next commit, so a probe four minutes
# later can still be looking at a stale page for reasons that need no human.
# It now runs TWO repair-and-wait cycles before it fails, which removes that
# false alarm without weakening the real one: if the loss is genuine it survives
# both cycles and the job still goes red and still emails.
#
# Every marker below was verified present on the live site on 2026-08-24.
# If one of these ever fails, something real broke - it is not a flaky check.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Write the probe
        run: |
          cat > /tmp/probe.sh <<'SH'
          set -uo pipefail
          BASE=https://ironcellresearch.com
          CB=$(date +%s)$RANDOM
          fails=0
          note () { echo "FAIL: $1"; fails=$((fails+1)); }

          # 1. The admin page itself loads.
          code=$(curl -sS -o /tmp/admin.html -w '%{http_code}' "$BASE/admin/?cb=$CB")
          [ "$code" = "200" ] || note "/admin/ returned HTTP $code"

          # 2. It is the real newsletter admin, not a placeholder, and the
          #    footer social row is still wired into the email template.
          for marker in 'function buildEmail' 'ironcell-send-newsletter' \
                        'email-icon-instagram.png' 'email-icon-tiktok.png' 'email-icon-facebook.png'; do
            grep -qF "$marker" /tmp/admin.html || note "/admin/ is missing: $marker"
          done

          # 3. The three hosted icons still resolve as real PNGs.
          for n in instagram tiktok facebook; do
            read -r c t <<<"$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$BASE/email-icon-$n.png?cb=$CB")"
            [ "$c" = "200" ] || note "email-icon-$n.png returned HTTP $c"
            case "$t" in image/png*) ;; *) note "email-icon-$n.png content-type is $t" ;; esac
          done

          # 4. The admin is still REACHABLE from the storefront footer.
          #    This is the check that catches the recurring publish revert.
          curl -sS "$BASE/?cb=$CB" -o /tmp/home.html
          grep -qF 'href="/admin/"' /tmp/home.html || note "the storefront footer has no link to /admin/"

          # 5. The admin login is still fenced off from search crawlers.
          curl -sS "$BASE/robots.txt?cb=$CB" -o /tmp/robots.txt
          grep -qF 'Disallow: /admin/' /tmp/robots.txt || note "robots.txt no longer fences /admin/"

          if [ "$fails" -ne 0 ]; then
            echo "$fails check(s) failed."
            exit 1
          fi
          echo "All checks passed. The newsletter admin entry is intact and reachable."
          SH
          chmod +x /tmp/probe.sh

      - name: Probe the published site
        id: first
        continue-on-error: true
        run: bash /tmp/probe.sh

      - name: Repair, then wait for the publish
        if: steps.first.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "The live admin entry is not reachable. Repairing before raising it."
          gh workflow run keep-admin-entry.yml --ref main || echo "could not dispatch the heal job"
          # Covers the other half: repo correct, published site stale because a
          # Pages build was cancelled by the next commit in a publish storm.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 \
            || echo "could not request a Pages rebuild"
          echo "Waiting 4 minutes for the heal commit and the Pages build."
          sleep 240

      - name: Probe again after the first repair
        id: second
        if: steps.first.outcome == 'failure'
        continue-on-error: true
        run: |
          bash /tmp/probe.sh && echo "Repaired automatically. No action needed."

      - name: Second repair cycle, in case a publish storm ate the first one
        if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Still not reachable. A publish storm can supersede the heal run and"
          echo "cancel the Pages build, so try once more before raising this."
          gh workflow run keep-admin-entry.yml --ref main || echo "could not dispatch the heal job"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 \
            || echo "could not request a Pages rebuild"
          echo "Waiting 5 minutes for the heal commit and the Pages build."
          sleep 300

      - name: Final probe, and fail for real this time
        if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
        run: |
          bash /tmp/probe.sh || {
            echo
            echo "The newsletter admin entry is STILL lost after two automatic repair attempts."
            echo "Open the Actions tab, look at the last 'Keep admin entry' run, and at"
            echo "the last 'pages build and deployment' run, in that order."
            exit 1
          }
          echo "Repaired automatically on the second cycle. No action needed."

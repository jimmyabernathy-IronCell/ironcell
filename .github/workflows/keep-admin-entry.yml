name: Keep admin entry

# WHY THIS EXISTS
# The storefront is published by writing whole files back from a local copy
# (the commits titled "Update index.html - peptide calculator"). Every such
# publish silently reverts anything newer than the copy it was written from.
# Measured, not guessed - the newsletter admin entry has been dropped this way:
#   2026-08-16  7dd054d2 index.html / 26c1504e robots.txt
#   2026-08-18  277b2669 index.html / f4b78155 robots.txt
#   2026-08-23  7c8ad139 index.html / c2c91ed3 robots.txt
# It was restored by hand once (45f5bf44, 2026-08-19) and was reverted again
# four days later, which is why a manual restore is not the fix.
#
# admin/index.html and the email-*.png files are NOT in that local copy, so they
# survive. Only the entry POINT is lost. This workflow puts it back automatically.
#
# HARDENED 2026-08-24 (a). Schedule every 30 minutes, cancel-in-progress off,
# and admin/index.html checked by CONTENT rather than by existence.
#
# HARDENED 2026-08-24 (b). Two things this job did not do before:
#
#   * IT NOW COVERS THE MEASUREMENT LAYER, NOT JUST THE ADMIN ENTRY.
#     The same 08-23 write-back that dropped the admin link also dropped the
#     Google Ads tag AW-18389709216, the newsletter-signup conversion and the
#     45-product ItemList structured data from index.html, and the subscriber
#     mirror from all eleven pages that carry a sign-up form. Nothing looked
#     different on the page, no error was thrown, and Ads kept spending against
#     a conversion signal that had gone silent. Those are now guarded too.
#
#   * IT NO LONGER FAILS WHEN A PUBLISH LANDS MID-REPAIR.
#     The storefront is published in storms of 20-30 commits in under a minute.
#     The old single `git push` was rejected non-fast-forward whenever one of
#     those landed first, the job went red, and GitHub emailed the repository
#     owner about a failure that was not his and that needed no action. It now
#     re-reads main, redoes the repair against the new content and pushes again,
#     and it exits clean when there is genuinely nothing to put back.
#
# WHAT THIS JOB WILL NOT TOUCH
# Product copy, pricing, the Spend & Save promotion, the cart, PayPal/Venmo/
# Zelle and the age gate. Every edit it makes is proved additive before it is
# written: the file must equal the original plus exactly one insert, a fixed
# list of checkout, cart, payment, age-gate and promotion markers must not move
# except where the insert itself contains them, and every inline script must
# still parse. If any of that fails the edit is thrown away, not committed.
#
# ONE EXCEPTION, ADDED 2026-08-24 (c): THE GOOGLE ADS PURCHASE CONVERSION.
# This job used to leave the checkout path alone entirely, and the purchase
# conversion AW-18389709216/BVXmCJiwnuIcEKDj8sBE was held back for that reason.
# It is the only one of the four measurement pieces that lives inside
# proceedWithOrder(), so leaving it out meant Google Ads received newsletter
# signups and no revenue signal at all, and the one hand restore of it was
# reverted by the next write-back four days later. It is maintained here now,
# under exactly the same additive proof as everything else: one insert, no
# sentinel may move beyond what the insert itself adds, and every inline script
# must still parse. It adds a tracking call below the duplicate-order guard and
# changes no checkout logic, no ordering, no totals, no coupon or promotion
# maths and no payment handling.

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-admin-entry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put back anything the last publish dropped, and publish the repair
        run: |
          set -uo pipefail

          cat > /tmp/heal.py <<'PY'
          import subprocess, os, re

          ADMIN_LINK = '<a href="/admin/" rel="nofollow noopener">Admin</a>'
          FENCE = 'Disallow: /admin/'

          GUARDED = {
              'admin/index.html': [b'function buildEmail',
                                   b'ironcell-send-newsletter',
                                   b'email-icon-instagram.png',
                                   b'email-icon-tiktok.png',
                                   b'email-icon-facebook.png'],
              'email-icon-instagram.png': [],
              'email-icon-tiktok.png': [],
              'email-icon-facebook.png': [],
              'email-logo-trans.png': [],
          }

          # ---------------------------------------------------------------- measurement
          # Every storefront surface. All eleven carry the same checkout - age gate,
          # cart, PayPal/Venmo/Zelle, proceedWithOrder() - and the same newsletter
          # sign-up form, so all eleven need the same measurement layer.
          #
          # This list used to be consulted for the subscriber mirror ONLY, while the
          # tag and the two conversions were hard-coded to index.html. That gap is why
          # the 08-23 pastes left ten live checkouts unmeasured for two days: the guard
          # healed index.html, reported success and never looked at the clones, so
          # orders placed on them were invisible to Google Ads and Smart Bidding
          # optimised on a partial revenue signal. Anything page-general belongs in the
          # loop below, not in a call that names a single file.
          STOREFRONT_PAGES = ['index.html', 'mvp.html', 'truetransformation.html',
                              'amber/index.html', 'billy/index.html', 'carlos/index.html',
                              'chel/index.html', 'davu/index.html', 'dupree/index.html',
                              'merv/index.html', 'ray/index.html']

          HEAD_ANCHOR = ('<html lang="en"><head><meta http-equiv="Content-Type" '
                         'content="text/html; charset=UTF-8">\n\n')
          HEAD_TAG = (
              '<!-- Google tag (gtag.js) - Google Ads AW-18389709216 -->\n'
              '<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18389709216"></script>\n'
              '<script>\n'
              '  window.dataLayer = window.dataLayer || [];\n'
              '  function gtag(){dataLayer.push(arguments);}\n'
              "  gtag('js', new Date());\n"
              "  gtag('config', 'AW-18389709216');\n"
              '</script>\n\n')

          NL_ANCHOR = '\n    // Immediate optimistic UI feedback so customers see confirmation'
          NL_CONV = (
              '\n\n    // Google Ads newsletter conversion (tag AW-18389709216, action "Newsletter\n'
              '    // signup"). Secondary and valueless in Ads, so it reports without competing\n'
              '    // with purchases for bidding. Same try/catch + typeof guard as the purchase\n'
              '    // event - gtag is absent whenever the tag script is blocked.\n'
              '    try {\n'
              "      if (typeof gtag === 'function') {\n"
              "        gtag('event', 'conversion', { 'send_to': 'AW-18389709216/jCpBCKnUsOIcEKDj8sBE' });\n"
              '      }\n'
              '    } catch (e) {}\n')

          # The purchase conversion. Anchored on the line that writes the grand total
          # onto the confirmation screen, inside proceedWithOrder(), BELOW the
          # _submittedOrders duplicate guard, so grandTotal and orderNum are both in
          # scope and it can fire at most once per order number.
          PURCHASE_ANCHOR = (
              "    var _ct = document.getElementById('confirmTotal');\n"
              "    if (_ct) _ct.textContent = '$' + grandTotal.toFixed(2);")
          PURCHASE_CONV = (
              '\n\n    // Google Ads purchase conversion (tag AW-18389709216, action "Purchase").'
              '\n    // Sits below the _submittedOrders guard above, so it fires at most once per'
              '\n    // order number, and inside try/catch because gtag is absent whenever the tag'
              '\n    // script is blocked - measurement must never be able to break checkout.'
              '\n    try {'
              "\n      if (typeof gtag === 'function') {"
              "\n        gtag('event', 'conversion', {"
              "\n          'send_to': 'AW-18389709216/BVXmCJiwnuIcEKDj8sBE',"
              "\n          'value': Number(grandTotal.toFixed(2)),"
              "\n          'currency': 'USD',"
              "\n          'transaction_id': orderNum"
              '\n        });'
              '\n      }'
              '\n    } catch (e) {}')

          SUB_ANCHOR = ("trackImg.src = 'https://script.google.com/macros/s/"
                        "AKfycbwha_53kpXJWgZ6X94dM4d9NJcgwaGabxKWPMJpQYaXQqMWmgoTpgcw7RARBu0quJ6BQw"
                        "/exec?type=newsletter&email=' + encodeURIComponent(email);")
          SUB_MIRROR = (
              "\n      // Mirror to the IronCell admin list (additive; the Google Sheet above is unchanged)"
              "\n      const mmSubImg = new Image();"
              "\n      mmSubImg.src = 'https://fnodwwpunekaycxxshbb.supabase.co/functions/v1/"
              "ironcell-ingest?t=sub&email=' + encodeURIComponent(email);")

          # The order mirror. Dropped by a client paste on 08-16 and again on 08-23; the
          # second loss ran two days unnoticed, because losing it breaks nothing visible -
          # the order still e-mails and still reaches the Google Sheet, it just stops
          # reaching /admin/ and stops enrolling the buyer in the newsletter list. It was
          # already a SENTINEL, which only stops it MOVING; nothing put it back. This does.
          ORDER_ANCHOR = '    sheetImg.src = sheetUrl;'
          ORDER_MIRROR = "\n\n    // Mirror the order to the IronCell admin dashboard (additive, fire-and-forget;\n    // isolated in its own try/catch so it can never affect checkout). Sits below the\n    // _submittedOrders guard, so it fires at most once per order number. Uses\n    // effectiveCoupon, not appliedCoupon, so an auto-applied Spend & Save tier\n    // (SPEND25/30/35) is recorded here the same way it is in the order email and the\n    // Google Sheet. Deleting this block silently stops orders reaching /admin/.\n    try {\n      var mmOrderImg = new Image();\n      mmOrderImg.src = 'https://fnodwwpunekaycxxshbb.supabase.co/functions/v1/ironcell-ingest?t=order' +\n        '&email=' + encodeURIComponent(email) +\n        '&name=' + encodeURIComponent(name) +\n        '&total=' + encodeURIComponent(grandTotal.toFixed(2)) +\n        '&coupon=' + encodeURIComponent(effectiveCoupon || '') +\n        '&items=' + encodeURIComponent(itemsList.split(String.fromCharCode(10)).join(' | '));\n    } catch (e) {}"


          HEAD_CLOSE = '\n</head>'

          # Nothing below may move. Checkout, cart, payment and the age gate are read
          # only to this job: if any of these counts changes the edit is thrown away.
          SENTINELS = ['function proceedWithOrder', 'function openCheckout', 'function closeCheckout',
                       'function handlePayment', 'function generateOrderNumber', 'function updateCartUI',
                       'function toggleCart', 'function closeAgeGate', 'ageGate', 'paypal', 'venmo',
                       'zelle', 'addToCart', 'grandTotal', 'web3forms', 'appliedCoupon', 'taxRate',
                       'SPEND35', 'SPEND30', 'SPEND25', 'SPEND & SAVE WEEK', 'getSpendSaveTier',
                       'BVXmCJiwnuIcEKDj8sBE', 'ironcell-ingest?t=order']

          changed = []


          def git(*a):
              return subprocess.run(['git', *a], capture_output=True)


          def additive_ok(before, after, added):
              """Prove the edit inserted exactly `added` and moved nothing else."""
              if len(after) - len(before) != len(added):
                  return 'byte delta %d, expected %d' % (len(after) - len(before), len(added))
              # A sentinel may appear inside the insert itself (the purchase conversion
              # legitimately references grandTotal and carries the conversion id), so
              # the requirement is that the count changes by EXACTLY what the insert
              # brings and by nothing else. Any other movement means the edit did more
              # than insert, and it is thrown away.
              for k in SENTINELS:
                  if after.count(k) != before.count(k) + added.count(k):
                      return 'sentinel moved: %s' % k
              if after.replace(added, '', 1) != before:
                  return 'the file is not the original plus exactly one insert'
              return None


          def scripts_parse(html):
              """Every inline <script> must still parse. JSON-LD is checked as JSON."""
              import json, tempfile, shutil
              if not shutil.which('node'):
                  return True
              blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S)
              # A regex that silently matches nothing would "pass" every file without
              # checking a single line, which is the failure mode most likely to let a
              # broken checkout through. Every storefront page here carries well over a
              # megabyte of inline script, so anything under 10KB means the extraction
              # broke rather than the page being small. Refuse the edit instead.
              if sum(len(b) for b in blocks) < 10000:
                  print('script extraction returned only %d bytes - not trusting it'
                        % sum(len(b) for b in blocks))
                  return False
              for b in blocks:
                  if not b.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as fh:
                      fh.write(b)
                      p = fh.name
                  try:
                      r = subprocess.run(['node', '--check', p], capture_output=True)
                  finally:
                      os.unlink(p)
                  if r.returncode != 0:
                      try:
                          json.loads(b)
                      except Exception:
                          return False
              return True


          def edit(path, why, fn):
              """fn(text) -> (newtext, inserted) or None. Applied only if provably additive."""
              if not os.path.exists(path):
                  return
              before = open(path, encoding='utf-8').read()
              res = fn(before)
              if res is None:
                  return
              after, added = res
              bad = additive_ok(before, after, added)
              if bad:
                  print('SKIP %s (%s): %s' % (path, why, bad))
                  return
              if not scripts_parse(after):
                  print('SKIP %s (%s): a script block no longer parses' % (path, why))
                  return
              open(path, 'w', encoding='utf-8').write(after)
              if path not in changed:
                  changed.append(path)
              print('restored %s: %s' % (path, why))


          def once(text, anchor, insert, after_anchor=True):
              if insert in text or text.count(anchor) != 1:
                  return None
              if after_anchor:
                  return text.replace(anchor, anchor + insert, 1), insert
              return text.replace(anchor, insert + anchor, 1), insert


          def itemlist_from_history():
              r = git('log', '--format=%H', '--', 'index.html')
              for sha in r.stdout.decode().split():
                  b = git('show', '%s:index.html' % sha)
                  if b.returncode:
                      continue
                  t = b.stdout.decode('utf-8', 'replace')
                  for m in re.finditer(r'<script type="application/ld\+json">.*?</script>', t, re.S):
                      if '"@type":"ItemList"' in m.group(0):
                          return m.group(0), sha
              return None, None


          def run():
              # 1. Files that must exist and must still be the real thing.
              for path, markers in GUARDED.items():
                  if os.path.exists(path):
                      if all(m in open(path, 'rb').read() for m in markers):
                          continue
                      print('%s is present but no longer complete - restoring' % path)
                  sha = blob = None
                  for s in git('log', '--format=%H', '--', path).stdout.decode().split():
                      b = git('show', '%s:%s' % (s, path))
                      if b.returncode == 0 and all(m in b.stdout for m in markers):
                          sha, blob = s, b.stdout
                          break
                  if blob is None:
                      print('CANNOT RESTORE %s: no good version in history' % path)
                      continue
                  os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
                  open(path, 'wb').write(blob)
                  changed.append(path)
                  print('restored %s from %s' % (path, sha[:8]))

              # 2. The footer link that reaches the admin.
              if os.path.exists('index.html'):
                  s = open('index.html', encoding='utf-8').read()
                  if ADMIN_LINK in s:
                      print('index.html: admin link present')
                  else:
                      i = s.find('<div class="footer-legal">')
                      j = s.find('</div>', i) if i != -1 else -1
                      if j != -1:
                          s = s[:j].rstrip(' ') + '        ' + ADMIN_LINK + '\n      ' + s[j:]
                          open('index.html', 'w', encoding='utf-8').write(s)
                          if 'index.html' not in changed:
                              changed.append('index.html')
                          print('index.html: admin link re-inserted into footer-legal')
                      else:
                          print('CANNOT RESTORE the admin link: footer-legal block not found')

              # 3. The crawl fence.
              #
              # Two layers. The per-agent layer first, because it is the one that
              # keeps getting lost: three publishes on 08-23/08-24 removed 96 lines
              # from robots.txt as pure deletions, and the /admin/ check below did
              # not notice because the wildcard fence survived each time.
              #
              # A NAMED AGENT DOES NOT INHERIT THE `*` GROUP. If GPTBot has its own
              # block it obeys only that block, so the fence has to be restated per
              # agent or it does not apply to them. The Peptide Guides disallows are
              # the load-bearing part: 34 .docx briefs carrying human dosing serve
              # live from a research-use-only store, and an AI crawler ingesting
              # them is a compliance problem rather than an SEO one.
              #
              # Recovered from history rather than hardcoded, so this job never
              # invents robots.txt content - same approach as the ItemList above. A
              # candidate is only accepted if it still carries the /admin/ fence.
              if os.path.exists('robots.txt'):
                  cur = open('robots.txt', encoding='utf-8').read()
                  if cur.count('User-agent:') < 14:
                      good = None
                      for sha in git('log', '--format=%H', '--', 'robots.txt').stdout.decode().split():
                          b = git('show', '%s:robots.txt' % sha)
                          if b.returncode:
                              continue
                          t = b.stdout.decode('utf-8', 'replace')
                          if t.count('User-agent:') >= 14 and FENCE in t and 'Peptide' in t:
                              good, gsha = t, sha
                              break
                      if good is None:
                          print('robots.txt: per-agent fence missing and no good version in history')
                      else:
                          # Additive only in spirit: this is a whole-file restore, so
                          # prove the replacement is a superset of what is there now.
                          missing = [ln for ln in cur.splitlines()
                                     if ln.strip() and ln not in good]
                          if missing:
                              print('robots.txt: SKIP per-agent restore, current file has '
                                    'lines the historical one lacks: %s' % missing[:3])
                          else:
                              open('robots.txt', 'w', encoding='utf-8').write(good)
                              if 'robots.txt' not in changed:
                                  changed.append('robots.txt')
                              print('robots.txt: per-agent crawl fence restored from %s '
                                    '(%d User-agent groups)' % (gsha[:8], good.count('User-agent:')))
                  else:
                      print('robots.txt: per-agent fence present (%d groups)'
                            % cur.count('User-agent:'))

                  r = open('robots.txt', encoding='utf-8').read()
                  if FENCE in r:
                      print('robots.txt: /admin/ fence present')
                  else:
                      out, done = [], False
                      for ln in r.splitlines():
                          out.append(ln)
                          if not done and ln.strip().lower() == 'user-agent: *':
                              out.append(FENCE)
                              done = True
                      if not done:
                          out += ['', 'User-agent: *', FENCE]
                      open('robots.txt', 'w', encoding='utf-8').write('\n'.join(out) + '\n')
                      changed.append('robots.txt')
                      print('robots.txt: /admin/ fence re-added')

              # 4. Measurement, on EVERY storefront page rather than just the homepage.
              #
              #    Five inserts, each keyed on the marker it installs rather than on the
              #    full text, so a reworded block can never be added twice and
              #    double-count an order or a signup. Two sit in <head>, two in
              #    subscribeNewsletter(), and two inside proceedWithOrder() - the
              #    purchase conversion and the order mirror. Both of those only add a
              #    tracking call: they touch no checkout logic, ordering, totals, coupon
              #    or promotion maths and no payment handling. Nothing here touches the
              #    cart, PayPal/Venmo/Zelle or the age gate, and the additive proof above
              #    throws the edit away if anything else moves by a single byte.
              #
              #    Every one of these is page-general. Do not re-introduce a call that
              #    names a single file - that is the bug this loop exists to close.
              MEASUREMENT = [
                  ('Google tag AW-18389709216', 'gtag/js?id=AW-18389709216',
                   HEAD_ANCHOR, HEAD_TAG, True),
                  ('Google Ads purchase conversion', 'BVXmCJiwnuIcEKDj8sBE',
                   PURCHASE_ANCHOR, PURCHASE_CONV, True),
                  ('Google Ads newsletter-signup conversion', 'jCpBCKnUsOIcEKDj8sBE',
                   NL_ANCHOR, NL_CONV, False),
                  ('order mirror (ironcell-ingest?t=order)', 'ironcell-ingest?t=order',
                   ORDER_ANCHOR, ORDER_MIRROR, True),
                  ('subscriber mirror (ironcell-ingest?t=sub)', 'ironcell-ingest?t=sub',
                   SUB_ANCHOR, SUB_MIRROR, True),
              ]

              for p in STOREFRONT_PAGES:
                  for why, marker, anchor, insert, after in MEASUREMENT:
                      # Bind the loop variables per iteration - a bare closure would
                      # read whatever the last iteration left behind.
                      def add(t, _m=marker, _a=anchor, _i=insert, _af=after):
                          return None if _m in t else once(t, _a, _i, after_anchor=_af)
                      edit(p, why, add)

              # The 45-product ItemList is homepage-only on purpose. The clones are
              # near-identical storefronts, so copying it onto all eleven would publish
              # eleven competing copies of the same product schema.
              def add_itemlist(t):
                  if '"@type":"ItemList"' in t or t.count(HEAD_CLOSE) != 1:
                      return None
                  block, sha = itemlist_from_history()
                  if block is None:
                      print('index.html: no ItemList block found in history')
                      return None
                  print('index.html: ItemList recovered from %s' % sha[:8])
                  return t.replace(HEAD_CLOSE, '\n' + block + HEAD_CLOSE, 1), '\n' + block

              edit('index.html', 'ItemList product structured data', add_itemlist)

              env = os.environ.get('GITHUB_ENV')
              if env:
                  open(env, 'a').write('HEALED=' + ' '.join(changed) + '\n')
              open('/tmp/healed.txt', 'w').write(' '.join(changed))
              print('HEALED: ' + (' '.join(changed) or '(nothing)'))


          run()
          PY

          git config user.name  "iron-cell-admin-guard"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            # Always repair against the newest main. A publish may have landed
            # since this run was queued, and re-deriving the fix from current
            # content is what makes the retry safe - there is nothing to rebase
            # and no conflict to resolve.
            git fetch --quiet origin main || echo "fetch failed, working with what is checked out"
            git reset --hard --quiet origin/main || true

            rm -f /tmp/healed.txt
            python3 /tmp/heal.py
            HEALED="$(cat /tmp/healed.txt 2>/dev/null || true)"

            if [ -z "$HEALED" ]; then
              echo "Nothing to do - the admin entry and the measurement layer are intact."
              exit 0
            fi

            git add -- $HEALED
            if git diff --cached --quiet; then
              echo "Nothing staged - nothing to commit."
              exit 0
            fi

            git commit --quiet \
              -m "Restore the newsletter admin entry and measurement dropped by the last publish" \
              -m "Files put back: $HEALED" \
              -m "Automatic. The storefront is published as a whole-file write-back, which reverts anything newer than the copy it was written from." \
              -m "Every change here is proved additive before it is written: the file must be the original plus exactly one insert, and no checkout, cart, payment, age gate or Spend & Save marker may move. Product copy, pricing, the promotion, the cart, PayPal and the age gate are never touched by this job. The only edit inside checkout is the Google Ads purchase conversion, which adds a tracking call and changes no checkout logic."

            if git push --quiet origin HEAD:main; then
              echo "Repair published on attempt $attempt: $HEALED"
              exit 0
            fi

            echo "Push rejected on attempt $attempt - a storefront publish landed first."
            echo "Re-reading main and redoing the repair against the new content."
            sleep $((attempt * 10))
          done

          # Not a failure worth emailing the site owner about: the next push and
          # the 30 minute schedule both re-run this job, and the hourly live
          # check still shouts if the loss is real and persists.
          echo "::warning::Could not publish the repair after 5 attempts because the storefront was being published throughout. The next scheduled run will retry."
          exit 0
